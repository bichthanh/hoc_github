<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape circle1"></div>
        <div class="shape circle2"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1>Fashion <span>Admin</span></h1>
            <button class="btn-primary" onclick="openModal()">+ Add New Item</button>
        </header>

        <div class="grid" id="clothes-grid">
            <!-- Clothes items will be dynamically injected here -->
        </div>
    </div>

    <!-- Modal for Create/Update -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal glass-panel">
            <h2 id="modalTitle">Add New Clothing</h2>
            <form id="itemForm">
                <input type="hidden" id="itemId">
                
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="itemName" required placeholder="e.g. Vintage Denim Jacket">
                </div>
                
                <div class="form-group row">
                    <div class="col">
                        <label>Price ($)</label>
                        <input type="number" id="itemPrice" step="0.01" required placeholder="0.00">
                    </div>
                    <div class="col">
                        <label>Stock</label>
                        <input type="number" id="itemStock" required placeholder="0">
                    </div>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="itemImage" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="itemDesc" rows="3" placeholder="Describe the clothing..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
